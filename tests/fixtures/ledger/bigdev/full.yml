# Sanitized replica of a real bigdev ledger (agents/voc-dev-manage-agent/待办/v3.0_2026-09-24/派工计划.yml).
# Mirrors the real shapes of top-level version/module/workers/tasks and task
# fields todo/objective/group/client/worker/lifecycle/evidence/status/
# depends_on/attempts/failure_class/reassigned_to; repo paths, worker names,
# and task content are all replaced with fictional samples. Status values mix
# four enum spellings to cover the mapping (legacy Chinese enums kept verbatim).
version: v2.0_2026-01-05
module: demo
clients: [Codex]
manager_actions: [split, analyze deps, dispatch, evidence review, redispatch, integrate]
parallelism:
  min_ready: 5
  actual_parallel: 3
  resource_conflict_reason: "The shared test environment is scheduled serially by the Manager."
failure_policy:
  classes: [infrastructure, assertion failure, timeout, dependency-blocked]
  reassign: "Assertion failures go back to the original worker; infrastructure and timeout cases are retried or reassigned by the Manager."
workers:
  demo-api-worker1:
    client: Codex
    clone: /workers/demo-api-agent1
  demo-ui-worker1:
    client: Codex
    clone: /workers/demo-ui-agent1
tasks:
  - id: demo-api-search
    todo: demo-api/search-pagination.md
    objective: "Paginate the search results while keeping assertion semantics unchanged."
    group: user-task collaboration
    client: Codex
    worker: demo-api-worker1
    depends_on: []
    lifecycle: [implement, test, deploy, real replay, commit, push, MR]
    evidence: demo-api test output/search-pagination/(to be generated)
    status: done
  - id: demo-ui-theme
    todo: demo-ui/theme-follows-system.md
    objective: "Make the UI theme follow the system light/dark mode, plus two acceptance criteria."
    group: user-task collaboration
    client: Codex
    worker: demo-ui-worker1
    depends_on: []
    lifecycle: [implement, test, deploy]
    evidence: demo-ui test output (to be generated)
    status: 进行中
  - id: demo-api-export
    todo: demo-api/export-progress-bar.md
    objective: "Switch large-table export to async and add a progress-query endpoint."
    group: experience fixes
    client: Codex
    worker: demo-api-worker1
    depends_on: [demo-api-search]
    lifecycle: [implement, test, MR]
    evidence: demo-api test output (to be generated)
    status: 待办
    attempts: 1
    failure_class: assertion failure
    failure_evidence: "01-04 first run timed out"
    reassigned_to: original worker
  - id: demo-ui-legacy-cleanup
    todo: demo-ui/retire-legacy-components.md
    objective: "Delete unreferenced legacy components and run the full regression."
    group: hygiene
    client: Codex
    worker: demo-ui-worker1
    depends_on: []
    lifecycle: [implement, test, MR]
    evidence: demo-ui test output (to be generated)
    status: queued
