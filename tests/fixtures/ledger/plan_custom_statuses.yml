# Test fixture: custom status enumeration — proves the enumeration comes
# from the file header statuses. "ready" is legal under the default
# enumeration, but here it is not in [todo, doing, done] and must be rejected.
project: demo
statuses: [todo, doing, done]
tasks:
  - id: A1
    title: Legal within the custom enumeration
    status: todo

  - id: A2
    title: Outside the custom enumeration
    status: ready
